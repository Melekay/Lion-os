services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.2.2
    restart: unless-stopped
    depends_on:
      - redis
      - database
    environment:
      TZ: Europe/Berlin
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
    ports:
      - "127.0.0.1:${LION_APP_PORT}:2283"
    volumes:
      - ${LION_APP_DATA}/bibliothek:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: false

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.2
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
    volumes:
      - modelle:/cache
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: false

  redis:
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${LION_APP_DATA}/datenbank:/var/lib/postgresql/data
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: false

volumes:
  modelle:
