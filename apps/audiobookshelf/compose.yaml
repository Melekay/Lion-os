services:
  app:
    image: ghcr.io/advplyr/audiobookshelf:2.36.1
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
    ports:
      - "127.0.0.1:${LION_APP_PORT}:80"
    volumes:
      - ${LION_APP_DATA}/config:/config
      - ${LION_APP_DATA}/metadaten:/metadata
      - ${LION_APP_DATA}/podcasts:/podcasts
      - ${LION_MEDIEN}/Hörbücher:/hoerbuecher:ro
    security_opt:
      - no-new-privileges:true
