# Prüft lion-core bei jedem Pull Request und jedem Push auf main.
name: lion-core

on:
  push:
    branches: [main]
    paths: ["core/**", "apps/**", ".github/workflows/core.yml"]
  # Ohne paths-Filter: Die Prüfungen sind im Regelwerk für main Pflicht und
  # müssen darum bei jedem Pull Request berichten, sonst bleibt „Mergen“ gesperrt.
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: lion-core – Typecheck, Tests, Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Server startet und antwortet
        run: |
          LION_SECRET="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')" \
          LION_DB="$RUNNER_TEMP/lion.db" LION_PORT=8099 node dist/index.js &
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:8099/api/health && exit 0; sleep 0.5; done
          exit 1

  docker-integration:
    name: lion-core – echte App-Installation und Backup mit Docker
    needs: pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      - name: Uptime Kuma installieren, erreichen, stoppen, starten, entfernen
        env:
          LION_DOCKER_TEST: "1"
        run: npx vitest run test/docker.integration.test.ts
      - name: Backup – echte Sicherung und Wiederherstellung mit restic
        env:
          LION_DOCKER_TEST: "1"
        run: npx vitest run test/backup.integration.test.ts

  vorlagen:
    name: App-Vorlage „${{ matrix.app }}“ wirklich installieren
    needs: pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app:
          - actual
          - audiobookshelf
          - filebrowser
          - home-assistant
          - immich
          - jellyfin
          - mealie
          - navidrome
          - nextcloud
          - ollama
          - paperless-ngx
          - stirling-pdf
          - uptime-kuma
          - vaultwarden
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Platz für große Images schaffen
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      - name: Installieren, Weboberfläche prüfen, Protokoll lesen, entfernen
        env:
          LION_APP_TEST: ${{ matrix.app }}
        run: npx vitest run test/vorlage.integration.test.ts
