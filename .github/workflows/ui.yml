# Prüft die Oberfläche (lion-ui) bei jedem Pull Request und jedem Push auf main.
name: lion-ui

on:
  push:
    branches: [main]
    paths: ["ui/**", "core/**", "apps/**", ".github/workflows/ui.yml"]
  # Ohne paths-Filter: Die Prüfungen sind im Regelwerk für main Pflicht und
  # müssen darum bei jedem Pull Request berichten, sonst bleibt „Mergen“ gesperrt.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  pruefen:
    name: lion-ui – Typecheck, Lint, Tests, Build, Browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            ui/package-lock.json

      - name: lion-core bauen (für die Tests gegen die echte API)
        working-directory: core
        run: npm ci && npm run build

      - run: npm ci
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - name: Demo als eine Datei bauen (ohne nachgeladene Skripte oder Stile)
        working-directory: ui
        run: |
          npm run demo:build
          ! grep -Eq '<script[^>]*src=|<link[^>]*stylesheet' demo/dist/index.html

      - name: Chromium installieren
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Browser-Tests (Attrappe + echtes lion-core, Desktop + Handy, Barrierefreiheit)
        working-directory: ui
        run: npx playwright test

      - name: Testergebnisse bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ergebnisse
          path: ui/test-results/
          retention-days: 7
